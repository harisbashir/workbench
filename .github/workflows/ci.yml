name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check apps config --select F,E9
      - name: Tests
        env:
          WORKBENCH_DEBUG: "1"
        run: python manage.py test apps
      - name: Production settings check (HTTPS mode)
        env:
          WORKBENCH_DOMAIN: workbench.example.com
        run: python manage.py check --deploy --fail-level WARNING
      - name: Build the container image
        run: docker build -t workbench:ci .
      - name: Container starts and reports healthy
        run: |
          docker run -d --name wb -p 8000:8000 workbench:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz; then exit 0; fi
            sleep 2
          done
          docker logs wb
          exit 1
      - name: Dependency audit
        run: pip install pip-audit && pip-audit -r requirements.txt
